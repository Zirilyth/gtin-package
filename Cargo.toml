[package]
name = "gtin-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
ron = "0.12.2"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"


[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
wildcard_enum_match_arm = "deny"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"


nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"


[dev-dependencies]
crepe = "0.2.0"
